# Build and game tests on every push and pull request (1.7.3, block B).
# runGameTestServer runs every test group (the list is the default of the gametest run in build.gradle)
# and fails the job when any required test fails.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the jar
        run: ./gradlew build -x test --no-daemon

      - name: Game tests (all groups)
        run: ./gradlew runGameTestServer --no-daemon

      - name: Test server log
        if: always()
        run: |
          log=$(ls runs/gameTestServer/logs/latest.log run/logs/latest.log 2>/dev/null | head -1)
          if [ -n "$log" ]; then grep -E "required tests|LogTestReporter|Exception" "$log" | tail -40 || true; fi

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: projectrebirth-jar
          path: build/libs/*.jar
          if-no-files-found: error
